- type: entity
  parent:
  - AppearanceChitinid
  - BaseSpeciesMobOrganic
  id: MobChitinid
  name: Urist McChitin
  components:
  - type: Damageable
    damageModifierSet: Chitinid
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 300
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#4a2f1a"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Speech
    speechSounds: Arachnid
    speechVerb: Arachnid
    allowedEmotes: ['Click', 'Chitter', 'Growl']
  - type: Vocal
    sounds:
      Male: UnisexChitinid
      Female: UnisexChitinid
      Unsexed: UnisexChitinid
  - type: TypingIndicator
    proto: spider
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 4
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 220
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 2

